[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unicorn"
version = "0.1.0"
description = "NBA Unicorn & Breakout Hunting: leakage-free historical backtesting of player development"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
